apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ocr.name" . }}
  labels:
    {{- include "ocr.labels" . | nindent 4 }}
data:
  config.yaml: |
    api_token: {{ .Values.config.apiToken | quote }}
    auth_required: {{ .Values.config.authRequired }}
    port: {{ .Values.config.port }}
    mode: {{ .Values.config.mode | quote }}
    default_region: {{ .Values.config.defaultRegion | quote }}
    generated_plate_prefix: {{ .Values.config.generatedPlatePrefix | quote }}
    fixtures:
      {{- toYaml .Values.config.fixtures | nindent 6 }}
    vehicles:
      {{- toYaml .Values.config.vehicles | nindent 6 }}
