name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install just
        uses: extractions/setup-just@v2

      # `just ci` builds Dockerfile.tests and runs gofmt + vet + golangci-lint +
      # Go race tests + Python SDK e2e tests entirely inside that image.
      - name: Run dockerized CI
        run: just ci
